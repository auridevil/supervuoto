<!doctype html>
<!-- supervuoto instagram cover. Rendered to social/supervuoto-ig-cover*.png.
     Starfield + nebulae + eye + glitch wordmark + vertical supervuoto.org.
     ?r=45 → 4:5 portrait (1080x1350); default → 1:1 square (1080x1080). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #stage {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background-color: #050208;
    background-image:
      radial-gradient(ellipse 100% 70% at 50% -10%, rgba(38, 18, 70, 0.65) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 85% 110%, rgba(8, 28, 38, 0.5) 0%, transparent 60%);
    font-family: 'Major Mono Display', monospace;
  }
  .neb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
  }
  .neb-a {
    width: 620px; height: 480px; top: -120px; left: -120px;
    background: radial-gradient(ellipse at center, rgba(124,58,237,0.28) 0%, transparent 70%);
  }
  .neb-b {
    width: 560px; height: 440px; bottom: -140px; right: -110px;
    background: radial-gradient(ellipse at center, rgba(34,211,238,0.20) 0%, rgba(240,171,252,0.10) 45%, transparent 72%);
  }
  #stars i { position: absolute; border-radius: 50%; }

  .eye {
    position: absolute;
    top: 214px; left: 50%;
    width: 430px; height: 430px;
    margin-left: -215px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 0 2px rgba(103,232,249,0.35),
      0 0 60px rgba(167,139,250,0.35),
      0 0 120px rgba(103,232,249,0.18);
  }

  .word {
    position: absolute;
    top: 726px; left: 0; right: 0;
    text-align: center;
    font-size: 122px;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    color: #ece9f7;
    text-shadow:
      -4px 0 rgba(103,232,249,0.9),
      4px 0 rgba(240,171,252,0.85),
      0 0 40px rgba(103,232,249,0.4);
  }

  /* 4:5 portrait (1080x1350) */
  #stage.portrait { height: 1350px; }
  #stage.portrait .eye { top: 320px; width: 470px; height: 470px; margin-left: -235px; }
  #stage.portrait .word { top: 920px; font-size: 130px; }

  .url {
    position: absolute;
    top: 50%; right: 34px;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-size: 22px;
    letter-spacing: 0.4em;
    text-transform: lowercase;
    color: rgba(103,232,249,0.55);
  }

  /* faint CRT vignette like the site */
  #stage::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 90% 90% at 50% 45%, transparent 58%, rgba(2,0,6,0.55) 100%);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="neb neb-a"></div>
    <div class="neb neb-b"></div>
    <div id="stars"></div>
    <img class="eye" src="/art/eye-moon.png" alt="" />
    <div class="word">supervuoto</div>
    <div class="url">supervuoto.org</div>
  </div>

  <script>
    const portrait = new URLSearchParams(location.search).get('r') === '45';
    const H = portrait ? 1350 : 1080;
    if (portrait) document.getElementById('stage').classList.add('portrait');
    const stars = document.getElementById('stars');
    const cols = ['#ece9f7', '#ece9f7', '#ece9f7', '#67e8f9', '#a78bfa', '#f0abfc'];
    const count = Math.round(120 * (H / 1080));
    for (let n = 0; n < count; n++) {
      const i = document.createElement('i');
      const s = Math.random() < 0.85 ? (1 + Math.random() * 1.6) : (2.4 + Math.random() * 1.8);
      i.style.width = i.style.height = s.toFixed(1) + 'px';
      i.style.left = (Math.random() * 1080).toFixed(0) + 'px';
      i.style.top = (Math.random() * H).toFixed(0) + 'px';
      const c = cols[(Math.random() * cols.length) | 0];
      i.style.background = c;
      i.style.opacity = (0.35 + Math.random() * 0.6).toFixed(2);
      if (s > 2.2) i.style.boxShadow = '0 0 6px ' + c;
      stars.appendChild(i);
    }
  </script>
</body>
</html>
