<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>SUPERVUOTO — secondo set · story</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --void-black: #050208;
    --deep-space: #0b0618;
    --nebula-purple: #a78bfa;
    --signal-cyan: #67e8f9;
    --ember-magenta: #f0abfc;
    --star-white: #ece9f7;
    --font-display: 'Major Mono Display', monospace;
    --font-body: 'Space Grotesk', sans-serif;
    --hairline: rgba(167, 139, 250, 0.26);
    --dim: rgba(236, 233, 247, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* IG story 9:16 */
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    /* top/bottom padding keeps content clear of the IG story UI overlays */
    padding: 206px 84px 226px;
    background: var(--void-black);
    color: var(--star-white);
    font-family: var(--font-body);
    overflow: hidden;
    isolation: isolate;   /* contain the blend modes to this canvas */
    display: flex;
    flex-direction: column;
  }

  /* the cymatic plate — sand on a vibrating membrane */
  #plate {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* vignette + fades so the type sits on quiet ground */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom, var(--void-black) 0%, rgba(5,2,8,0.75) 9%, transparent 19%),
      linear-gradient(to top, var(--void-black) 0%, rgba(5,2,8,0.8) 8%, transparent 21%),
      radial-gradient(42% 22% at 26% 70%, rgba(5,2,8,0.55) 0%, transparent 100%),
      radial-gradient(78% 48% at 50% 44%, transparent 55%, rgba(5,2,8,0.72) 100%);
  }

  /* film grain, over everything */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 6;
    opacity: 0.2;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }

  /* Content sits above the veil (z 1). The names carry their own z-index rather
     than taking it from .lineup, which would make .lineup a stacking context and
     kill their blend against the plate. */
  .story > .head,
  .story > .meta,
  .story > .foot { position: relative; z-index: 2; }
  .story > .spacer,
  .story > .lineup { position: relative; }

  /* ---------- HEADER ---------- */
  .head {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .head-sigil { width: 40px; height: 40px; flex: none; opacity: 0.9; }
  .nth {
    margin-left: auto;
    font-family: var(--font-display);
    font-size: 64px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--ember-magenta);
    letter-spacing: 0.1em;
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 34px;
    letter-spacing: 0.38em;
    text-transform: lowercase;
    margin: 0;
  }

  /* ---------- WHEN ---------- */
  .meta {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    font-family: var(--font-display);
    font-size: 25px;
    letter-spacing: 0.16em;
    text-transform: lowercase;
  }
  .meta .when { color: var(--star-white); }
  .meta .when .d { color: var(--nebula-purple); }
  .meta .hours { color: var(--signal-cyan); }

  /* the plate breathes here */
  .spacer { flex: 1; min-height: 0; }

  /* ---------- LINEUP — overprinted on the plate ---------- */
  .lineup {
    margin-bottom: 42px;
  }
  .act {
    display: block;
    font-family: var(--font-display);
    font-size: 72px;
    line-height: 1.26;
    letter-spacing: 0.01em;
    text-transform: lowercase;
    margin: 0;
    white-space: nowrap;
    position: relative;
    z-index: 2;
    mix-blend-mode: difference;   /* the names eat into the sand */
  }
  .act:nth-of-type(1) { color: var(--star-white); }
  .act:nth-of-type(2) { color: var(--signal-cyan);  padding-left: 58px; }
  .act:nth-of-type(3) { color: var(--star-white);   padding-left: 116px; }
  .act:nth-of-type(4) { color: var(--ember-magenta); padding-left: 174px; }
  .act:nth-of-type(5) { color: var(--nebula-purple); padding-left: 232px; }

  /* ---------- FOOTER ---------- */
  .foot {
    padding-top: 26px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .foot-place {
    font-family: var(--font-display);
    font-size: 46px;
    letter-spacing: 0.07em;
    text-transform: lowercase;
    margin: 0 0 8px;
  }
  .foot-kind {
    font-size: 21px;
    font-weight: 300;
    letter-spacing: 0.09em;
    color: var(--dim);
    margin: 0;
  }
  .foot-meta {
    text-align: right;
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: lowercase;
    line-height: 2.2;
  }
  .foot-meta .motto { color: var(--ember-magenta); display: block; }
  .foot-meta .handle { color: rgba(236, 233, 247, 0.4); display: block; }
</style>
</head>
<body>

<section class="story">

  <canvas id="plate" width="1080" height="1920"></canvas>
  <div class="veil"></div>
  <div class="grain"></div>

  <!-- HEADER -->
  <div class="head">
    <svg class="head-sigil" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" stroke="#ece9f7" stroke-width="4"/>
      <line x1="16" y1="84" x2="84" y2="16" stroke="#a78bfa" stroke-width="4"/>
    </svg>
    <h1 class="wordmark">supervuoto</h1>
    <span class="nth">ii</span>
  </div>

  <!-- WHEN -->
  <div class="meta">
    <span class="when">gio <span class="d">26</span> novembre</span>
    <span class="hours">19.45 — 23.00</span>
  </div>

  <div class="spacer"></div>

  <!-- LINEUP -->
  <div class="lineup">
    <h2 class="act">lhotse</h2>
    <h2 class="act">cana</h2>
    <h2 class="act">elmozzo</h2>
    <h2 class="act">alemcd</h2>
    <h2 class="act">raja</h2>
  </div>

  <!-- FOOTER -->
  <div class="foot">
    <div>
      <p class="foot-place">fossano</p>
      <p class="foot-kind">private party</p>
    </div>
    <div class="foot-meta">
      <span class="motto">contro la perfezione</span>
      <span class="motto">contro la definizione</span>
      <span class="handle">supervuoto.org</span>
    </div>
  </div>

</section>

<script>
(function () {
  const cv = document.getElementById('plate');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  function lcg(seed) {
    return function () {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  function chladni(u, v, n, m) {
    return Math.sin(n * Math.PI * u) * Math.sin(m * Math.PI * v)
         + Math.sin(m * Math.PI * u) * Math.sin(n * Math.PI * v);
  }

  ctx.fillStyle = '#050208';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // ---- I. the first plate (26 ottobre), as a memory: same seed, same four modes,
  //      shrunk and dimmed, up in the corner
  {
    const rnd = lcg(20261026);
    const CX = 250, CY = 600, R = 220;
    const MODES = [
      { n: 3, m: 7,  target: 5200, sigma: 0.055 },
      { n: 5, m: 9,  target: 5200, sigma: 0.05  },
      { n: 2, m: 11, target: 3800, sigma: 0.045 },
      { n: 8, m: 13, target: 4500, sigma: 0.04  },
    ];
    for (const mode of MODES) {
      let placed = 0, tries = 0;
      while (placed < mode.target && tries < mode.target * 90) {
        tries++;
        const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * R;
        const x = CX + Math.cos(a) * rr, y = CY + Math.sin(a) * rr;
        const f = chladni((x - CX + R) / (2 * R), (y - CY + R) / (2 * R), mode.n, mode.m);
        if (rnd() > Math.exp(-(f * f) / (mode.sigma * mode.sigma))) continue;
        const t = rr / R;
        if (rnd() > Math.pow(t < 0.72 ? 1 : Math.max(0, 1 - (t - 0.72) / 0.28), 2)) continue;
        ctx.fillStyle = 'rgba(167,139,250,' + (0.45 * (0.3 + rnd() * 0.5)).toFixed(3) + ')';
        ctx.fillRect(x, y, 1.1, 1.1);
        placed++;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(167,139,250,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
  }

  // ---- II. the second plate: bigger, five modes (one per name), and the frequency
  //      is higher — the sand no longer sits still, it streams along the nodal lines
  //      and gets flung off the rim
  const rnd = lcg(20261126);
  const CX = 676, CY = 1010, R = 560;
  const MODES = [
    { n: 4, m: 9,  color: [103, 232, 249], target: 9500,  sigma: 0.06  }, // cyan
    { n: 3, m: 13, color: [167, 139, 250], target: 9500,  sigma: 0.055 }, // purple
    { n: 6, m: 11, color: [240, 171, 252], target: 7500,  sigma: 0.05  }, // magenta
    { n: 1, m: 5,  color: [103, 232, 249], target: 5500,  sigma: 0.055 }, // cyan, low
    { n: 7, m: 15, color: [236, 233, 247], target: 9000,  sigma: 0.045 }, // white
  ];
  const E = 1e-3;
  for (const mode of MODES) {
    const [cr, cg, cb] = mode.color;
    let placed = 0, tries = 0;
    while (placed < mode.target && tries < mode.target * 90) {
      tries++;
      const a = rnd() * Math.PI * 2;
      const rr = Math.sqrt(rnd()) * R * 1.12;          // samples spill past the rim
      const x = CX + Math.cos(a) * rr, y = CY + Math.sin(a) * rr;
      const u = (x - CX + R) / (2 * R), v = (y - CY + R) / (2 * R);
      const f = chladni(u, v, mode.n, mode.m);
      if (rnd() > Math.exp(-(f * f) / (mode.sigma * mode.sigma))) continue;
      const t = rr / R;
      const fade = t < 0.8 ? 1 : Math.max(0, 1 - (t - 0.8) / 0.32);
      if (rnd() > fade * fade) continue;

      const alpha = (0.5 * (0.3 + rnd() * 0.5)).toFixed(3);
      ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + alpha + ')';
      ctx.lineWidth = rnd() < 0.08 ? 1.8 : 1;
      ctx.beginPath();
      if (t > 0.86) {
        // escaping: a radial streak flung outward, longer the further out
        const L = 6 + (t - 0.86) * 160 * rnd();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L);
      } else {
        // on the plate: a short dash along the nodal line (tangent to f = 0)
        const gx = chladni(u + E, v, mode.n, mode.m) - f;
        const gy = chladni(u, v + E, mode.n, mode.m) - f;
        const g = Math.hypot(gx, gy) || 1;
        const tx = -gy / g, ty = gx / g;
        const L = 1.5 + rnd() * 4.5;
        ctx.moveTo(x - tx * L / 2, y - ty * L / 2);
        ctx.lineTo(x + tx * L / 2, y + ty * L / 2);
      }
      ctx.stroke();
      placed++;
    }
  }

  ctx.globalCompositeOperation = 'source-over';

  // the sigil at poster scale — now two rings, the first one echoing
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(167, 139, 250, 0.32)';
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(103, 232, 249, 0.16)';
  ctx.beginPath(); ctx.arc(CX, CY, R + 22, 0, Math.PI * 2); ctx.stroke();
  // one slash cuts through both plates: the line from the first night to the second
  ctx.strokeStyle = 'rgba(167, 139, 250, 0.2)';
  ctx.beginPath();
  ctx.moveTo(CX - R * 0.707, CY + R * 0.707);
  ctx.lineTo(CX + R * 0.707, CY - R * 0.707);
  ctx.stroke();

  // more slices knocked out of register than the first time
  const slices = [
    { y: 560,  h: 8,  dx: 18 },
    { y: 742,  h: 14, dx: -36 },
    { y: 905,  h: 6,  dx: 52 },
    { y: 1130, h: 12, dx: 40 },
    { y: 1318, h: 20, dx: -24 },
  ];
  for (const sl of slices) {
    const band = ctx.getImageData(0, sl.y, W, sl.h);
    ctx.fillStyle = '#050208';
    ctx.fillRect(0, sl.y, W, sl.h);
    ctx.putImageData(band, sl.dx, sl.y);
  }
})();
</script>

</body>
</html>
