<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>SUPERVUOTO — secondo set · story · d</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --void-black: #050208;
    --deep-space: #0b0618;
    --nebula-purple: #a78bfa;
    --signal-cyan: #67e8f9;
    --ember-magenta: #f0abfc;
    --star-white: #ece9f7;
    --font-display: 'Major Mono Display', monospace;
    --font-body: 'Space Grotesk', sans-serif;
    --hairline: rgba(167, 139, 250, 0.26);
    --dim: rgba(236, 233, 247, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* IG story 9:16 */
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    /* top/bottom padding keeps content clear of the IG story UI overlays */
    padding: 206px 84px 226px;
    background: var(--void-black);
    color: var(--star-white);
    font-family: var(--font-body);
    overflow: hidden;
    isolation: isolate;   /* contain the blend modes to this canvas */
    display: flex;
    flex-direction: column;
  }

  /* the cymatic plate — sand on a vibrating membrane */
  #plate {
    background: #050208;
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* vignette + fades so the type sits on quiet ground */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to bottom, var(--void-black) 0%, rgba(5,2,8,0.75) 9%, transparent 19%),
      linear-gradient(to top, var(--void-black) 0%, rgba(5,2,8,0.8) 8%, transparent 21%),
      radial-gradient(60% 24% at 28% 70%, rgba(5,2,8,0.85) 0%, transparent 100%),
      radial-gradient(78% 48% at 50% 44%, transparent 55%, rgba(5,2,8,0.72) 100%);
  }

  /* film grain, over everything */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 6;
    opacity: 0.2;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }

  /* Content sits above the veil (z 1). The names carry their own z-index rather
     than taking it from .lineup, which would make .lineup a stacking context and
     kill their blend against the plate. */
  .story > .head,
  .story > .meta,
  .story > .foot { position: relative; z-index: 2; }
  .story > .spacer,
  .story > .lineup { position: relative; }

  /* ---------- HEADER ---------- */
  .head {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .head-sigil { width: 40px; height: 40px; flex: none; opacity: 0.9; }
  .nth {
    margin-left: auto;
    font-family: var(--font-display);
    font-size: 64px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--ember-magenta);
    letter-spacing: 0.1em;
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 34px;
    letter-spacing: 0.38em;
    text-transform: lowercase;
    margin: 0;
  }

  /* ---------- WHEN ---------- */
  .meta {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    font-family: var(--font-display);
    font-size: 25px;
    letter-spacing: 0.16em;
    text-transform: lowercase;
  }
  .meta .when { color: var(--star-white); }
  .meta .when .d { color: var(--nebula-purple); }
  .meta .hours { color: var(--signal-cyan); }

  /* the plate breathes here */
  .spacer { flex: 1; min-height: 0; }

  /* ---------- LINEUP — overprinted on the plate ---------- */
  .lineup {
    margin-bottom: 42px;
  }
  .act {
    display: block;
    font-family: var(--font-display);
    font-size: 72px;
    line-height: 1.26;
    letter-spacing: 0.01em;
    text-transform: lowercase;
    margin: 0;
    white-space: nowrap;
    position: relative;
    z-index: 2;
    mix-blend-mode: difference;   /* the names eat into the sand */
  }
  .act:nth-of-type(1) { color: var(--star-white); }
  .act:nth-of-type(2) { color: var(--signal-cyan);  padding-left: 58px; }
  .act:nth-of-type(3) { color: var(--star-white);   padding-left: 116px; }
  .act:nth-of-type(4) { color: var(--ember-magenta); padding-left: 174px; }
  .act:nth-of-type(5) { color: var(--nebula-purple); padding-left: 232px; }

  /* ---------- NOTE — a field annotation on the lens ---------- */
  .note {
    position: absolute;
    z-index: 2;
    left: 84px;
    top: 400px;
    text-align: left;
    text-align: right;
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    line-height: 1.7;
    color: var(--signal-cyan);
    opacity: 0.85;
  }
  .note span { display: block; }
  .note sub { font-size: 15px; }
  .note .dim { color: rgba(236, 233, 247, 0.75); }

  /* ---------- FOOTER ---------- */
  .foot {
    padding-top: 26px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .foot-place {
    font-family: var(--font-display);
    font-size: 46px;
    letter-spacing: 0.07em;
    text-transform: lowercase;
    margin: 0 0 8px;
  }
  .foot-kind {
    font-size: 21px;
    font-weight: 300;
    letter-spacing: 0.09em;
    color: var(--dim);
    margin: 0;
  }
  .foot-meta {
    text-align: right;
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: lowercase;
    line-height: 2.2;
  }
  .foot-meta .motto { color: var(--ember-magenta); display: block; }
  .foot-meta .handle { color: rgba(236, 233, 247, 0.4); display: block; }
</style>
</head>
<body>

<section class="story">

  <canvas id="plate" width="1080" height="1920"></canvas>
  <div class="veil"></div>
  <div class="grain"></div>

  <!-- HEADER -->
  <div class="head">
    <svg class="head-sigil" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" stroke="#ece9f7" stroke-width="4"/>
      <line x1="16" y1="84" x2="84" y2="16" stroke="#a78bfa" stroke-width="4"/>
    </svg>
    <h1 class="wordmark">supervuoto</h1>
    <span class="nth">ii</span>
  </div>

  <!-- WHEN -->
  <div class="meta">
    <span class="when">gio <span class="d">26</span> novembre</span>
    <span class="hours">19.45 — 23.00</span>
  </div>

  <div class="note">
    <span>24 fotogrammi</span>
    <span>al secondo</span>
    <span class="dim">il resto</span>
    <span class="dim">lo cuce la mente</span>
  </div>

  <div class="spacer"></div>

  <!-- LINEUP -->
  <div class="lineup">
    <h2 class="act">lhotse</h2>
    <h2 class="act">cana</h2>
    <h2 class="act">elmozzo</h2>
    <h2 class="act">alemcd</h2>
    <h2 class="act">raja</h2>
  </div>

  <!-- FOOTER -->
  <div class="foot">
    <div>
      <p class="foot-place">fossano</p>
      <p class="foot-kind">private party</p>
    </div>
    <div class="foot-meta">
      <span class="motto">contro la perfezione</span>
      <span class="motto">contro la definizione</span>
      <span class="handle">supervuoto.org</span>
    </div>
  </div>

</section>

<script>
// D — persistence of vision. The plate as a strip of film running from the
// first night (top) to the second (bottom): every frame the standing waves have
// moved a little; continuity is something the mind adds.
(function () {

  let seed = 24242611;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  function chladni(u, v, n, m) {
    return Math.sin(n * Math.PI * u) * Math.sin(m * Math.PI * v)
         + Math.sin(m * Math.PI * u) * Math.sin(n * Math.PI * v);
  }
  const cv = document.getElementById('plate');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  function draw() {
    ctx.fillStyle = '#050208';
    ctx.fillRect(0, 0, W, H);

    const CXs = 820, CYs = 980, ROT = -4 * Math.PI / 180;
    const SW = 460, FW = 340, FH = 255, PITCH = 285;

    // night 1 -> night 2: four modes drift to new ones, a fifth fades in
    const L = [
      { a: [3, 7],  b: [4, 9],  c: [103, 232, 249], s: 0.05 },
      { a: [5, 9],  b: [3, 13], c: [167, 139, 250], s: 0.05 },
      { a: [2, 11], b: [6, 11], c: [240, 171, 252], s: 0.045 },
      { a: [8, 13], b: [7, 15], c: [236, 233, 247], s: 0.04 },
      { a: null,    b: [1, 4],  c: [103, 232, 249], s: 0.05 },
    ];

    ctx.save();
    ctx.translate(CXs, CYs);
    ctx.rotate(ROT);

    // film base
    ctx.fillStyle = 'rgba(22, 13, 36, 0.94)';
    ctx.fillRect(-SW / 2, -1300, SW, 2600);
    ctx.strokeStyle = 'rgba(167,139,250,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-SW / 2 + 0.5, -1300, SW - 1, 2600);

    // sprocket holes, both edges
    ctx.fillStyle = '#050208';
    for (let y = -1300; y < 1300; y += PITCH / 4) {
      for (const x of [-SW / 2 + 10, SW / 2 - 10 - 28]) {
        ctx.beginPath();
        ctx.roundRect(x, y, 28, 20, 4);
        ctx.fill();
      }
    }

    // optical soundtrack, variable area: sound written as light
    ctx.fillStyle = 'rgba(103,232,249,0.35)';
    for (let y = -1300; y < 1300; y += 1) {
      const amp = Math.abs(Math.sin(y / 6.3) * (0.55 + 0.45 * Math.sin(y / 47)) * (0.6 + 0.4 * Math.sin(y / 173)));
      const w = 14 * amp, cx0 = -SW / 2 + 53;
      ctx.fillRect(cx0 - w / 2, y, w, 1);
    }

    const KMIN = -3, KMAX = 3;
    for (let k = KMIN; k <= KMAX; k++) {
      const t = Math.min(1, Math.max(0, (k + 2) / 3));   // visible frames: night 1, 1/3, 2/3, night 2
      const jx = 0, jy = 0;
      const fx = -FW / 2 + 8 + jx, fy = k * PITCH - FH / 2 + 30 + jy;

      ctx.fillStyle = '#06030b';
      ctx.fillRect(fx, fy, FW, FH);

      ctx.save();
      ctx.beginPath(); ctx.rect(fx, fy, FW, FH); ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      // each frame is one discrete state: modes step from night 1 to night 2
      const pcx = fx + FW / 2, pcy = fy + FH / 2, PR = FH * 0.46;
      const drawState = (t, am, ox) => {
      for (const ly of L) {
        let n, m;
        if (!ly.a) { if (t < 0.5) continue; [n, m] = ly.b; }
        else { n = Math.round(ly.a[0] + (ly.b[0] - ly.a[0]) * t); m = Math.round(ly.a[1] + (ly.b[1] - ly.a[1]) * t); }
        const target = 3400;
        let placed = 0, tries = 0;
        while (placed < target && tries < target * 90) {
          tries++;
          const an = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * PR;
          const x = pcx + ox + Math.cos(an) * rr, y = pcy + Math.sin(an) * rr;
          const f = chladni((x - pcx - ox + PR) / (2 * PR), (y - pcy + PR) / (2 * PR), n, m);
          if (rnd() > Math.exp(-(f * f) / (ly.s * ly.s * 0.7))) continue;
          const tt = rr / PR;
          if (rnd() > (tt < 0.75 ? 1 : Math.max(0, 1 - (tt - 0.75) / 0.25))) continue;
          const g = 0.35 + rnd() * 0.5;
          ctx.fillStyle = 'rgba(' + ly.c[0] + ',' + ly.c[1] + ',' + ly.c[2] + ',' + (0.7 * g * am).toFixed(3) + ')';
          ctx.fillRect(x, y, 1.1, 1.1);
          placed++;
        }
      }
      };
      if (k === 0) { drawState(t - 0.17, 0.6, -7); drawState(t + 0.17, 0.6, 7); }
      else drawState(t, 1, 0);
      // ring + slash of the sigil, a ghost in every frame
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(167,139,250,0.22)';
      ctx.beginPath(); ctx.arc(pcx, pcy, PR, 0, Math.PI * 2); ctx.stroke();
      // exposure varies frame to frame
      ctx.fillStyle = 'rgba(5,2,8,' + (0.08 + 0.18 * rnd()).toFixed(3) + ')';
      ctx.fillRect(fx, fy, FW, FH);
      ctx.restore();

      // edge code, like the latent print on stock
      ctx.save();
      ctx.translate(SW / 2 - 4, fy + FH / 2);
      ctx.rotate(Math.PI / 2);
      ctx.font = '10px "Major Mono Display"';
      ctx.fillStyle = 'rgba(240,171,252,0.55)';
      ctx.textAlign = 'center';
      const day = t < 0.5 ? '26.10' : '26.11';
      ctx.fillText('sv ' + day + '  ⊘  ' + String(k - KMIN + 1).padStart(2, '0'), 0, 3);
      ctx.restore();
    }

    // a long scratch down the emulsion
    ctx.strokeStyle = 'rgba(236,233,247,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = -1300; y <= 1300; y += 20) {
      const x = 62 + Math.sin(y / 170) * 3 + (rnd() - 0.5) * 1.5;
      y === -1300 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // edge burn: the stock saw daylight, bleeding in from the perf side
    ctx.globalCompositeOperation = 'screen';
    const eb = ctx.createLinearGradient(SW / 2, 0, SW / 2 - 120, 0);
    eb.addColorStop(0, 'rgba(255,140,90,0.25)');
    eb.addColorStop(1, 'rgba(255,140,90,0)');
    ctx.fillStyle = eb;
    for (const [y0, h] of [[-420, 300], [180, 120]]) {
      const vg = ctx.createLinearGradient(0, y0, 0, y0 + h);
      ctx.save();
      ctx.beginPath(); ctx.rect(SW / 2 - 120, y0, 120, h); ctx.clip();
      ctx.fillRect(SW / 2 - 120, y0, 120, h);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // the strip dissolves before the header and the footer: it runs through the
    // flyer, not over its words
    ctx.globalCompositeOperation = 'destination-out';
    const top = ctx.createLinearGradient(0, 330, 0, 520);
    top.addColorStop(0, 'rgba(0,0,0,1)'); top.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = top; ctx.fillRect(0, 0, W, 520);
    const bot = ctx.createLinearGradient(0, 1420, 0, 1560);
    bot.addColorStop(0, 'rgba(0,0,0,0)'); bot.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = bot; ctx.fillRect(0, 1420, W, H - 1420);
    ctx.globalCompositeOperation = 'source-over';

    // light leak where the film was exposed to the room

  }
  document.fonts.load('13px "Major Mono Display"').then(draw, draw);
})();
</script>

</body>
</html>
